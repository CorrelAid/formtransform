name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install node deps
        run: npm ci
      - name: TS/JS quality gates (lint, types, format, knip, dup, arch, md)
        run: npm run validate
      - uses: astral-sh/setup-uv@v3
      - name: Install python deps
        run: uv sync
      - name: Python lint (ruff)
        run: uv run ruff check .
      - name: Python format check (ruff)
        run: uv run ruff format --check .

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install node deps (prepare builds dist/, which the CLI test runs)
        run: npm ci
      - name: Unit, integration and contract tests (vitest)
        run: npm test

  drift-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v3
      - name: Install codegen deps
        run: uv sync
      - name: Check generated/ in sync with codegen
        run: bash scripts/check-drift.sh
      # Codegen above rendered registry/entities/*/generated/xlsform.xlsx.
      - name: Registry validators (codegen) and the pyxform oracle
        run: uv run pytest tests/codegen tests/validation/test_xlsform_pyxform.py -v
        env:
          FT_REQUIRE_ORACLES: "1"

  schematron-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v3
      - name: schematron-worker unit tests
        working-directory: workers/schematron-worker
        run: gradle --no-daemon test
      - name: Build schematron-worker shadow jar
        run: bash scripts/build-worker.sh
      - name: Install registry test deps
        run: uv sync
      - name: DDI snapshots (XSD + schematron), Schematron conformance and mutations, Python reader
        run: >-
          uv run pytest
          tests/validation/test_ddi_schema.py
          tests/validation/test_registry_schematron_conformance.py
          tests/validation/test_ddi_reader.py -v
        env:
          FT_REQUIRE_ORACLES: "1"

